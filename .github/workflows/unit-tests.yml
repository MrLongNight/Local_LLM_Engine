name: Unit Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests (app + llm-engine)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21 (required by Robolectric SDK 36)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      # GitHub-hosted Ubuntu runners already provide the Android SDK.
      # Avoid setup-android: it tries to install the removed legacy "tools" package.
      - name: Configure preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT/cmdline-tools"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f -print | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "Using Android SDK at $SDK_ROOT"
          "$SDKMANAGER" --version

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail
          # sdkmanager closes stdin after accepting the final license. That makes
          # yes exit with SIGPIPE; keep pipefail off so sdkmanager's status wins.
          set +o pipefail
          yes | sdkmanager --licenses

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest :llm-engine:testDebugUnitTest

      - name: Print failed JUnit assertions
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          report_files = sorted(
              glob.glob("app/build/test-results/testDebugUnitTest/TEST-*.xml")
              + glob.glob("llm-engine/build/test-results/testDebugUnitTest/TEST-*.xml")
          )
          if not report_files:
              print("No JUnit XML reports were generated.")
          for report_file in report_files:
              try:
                  root = ET.parse(report_file).getroot()
              except (ET.ParseError, OSError) as error:
                  print(f"Could not parse {report_file}: {error}")
                  continue
              for case in root.findall(".//testcase"):
                  for failure in list(case.findall("failure")) + list(case.findall("error")):
                      name = f"{case.get('classname', 'unknown')}.{case.get('name', 'unknown')}"
                      print(f"FAILED: {name}")
                      print(f"Type: {failure.get('type', 'unknown')}")
                      print(f"Message: {failure.get('message', '(no assertion message)')}")
                      detail = (failure.text or "").strip()
                      if detail:
                          print("Failure detail:")
                          print(detail[-12000:])
          PY

      - name: Upload unit-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports-${{ github.run_number }}
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
            llm-engine/build/test-results/testDebugUnitTest/
            llm-engine/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14
