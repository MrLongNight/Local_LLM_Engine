name: Unit Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests (app + llm-engine)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (required by Robolectric SDK 36)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Locate Android SDK command-line tools
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT/cmdline-tools" ]; then
            echo "::error::Android SDK command-line tools directory not found (ANDROID_HOME=$SDK_ROOT)"
            exit 1
          fi
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -perm -u+x -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager executable not found under $SDK_ROOT/cmdline-tools"
            find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -type f -print || true
            exit 1
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "Using Android SDK manager: $SDKMANAGER"

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-36"
          yes | sdkmanager --licenses

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest :llm-engine:testDebugUnitTest
