name: Unit Tests

on:
  push:
    branches:
      - main
    paths:
      - "app/src/**"
      - "app/build.gradle.kts"
      - "llm-engine/src/**"
      - "llm-engine/build.gradle.kts"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradle.properties"
      - "gradle/libs.versions.toml"
      - ".gitmodules"
      - ".github/workflows/unit-tests.yml"
      - ".github/workflows/manual-apk.yml"
      - ".github/scripts/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests (app + llm-engine)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # The JVM and host-only tests do not compile llama.cpp; skip its large submodule.

      - name: Set up JDK 21 (required by Robolectric SDK 36)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      # JVM tests need the compile SDK, but do not invoke the native Android toolchain.
      # The runner image already carries this platform; avoid downloading NDK/CMake
      # and accepting licenses on every unit-test run.
      - name: Verify preinstalled Android SDK platform
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -f "$SDK_ROOT/platforms/android-36/android.jar"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "Using preinstalled Android 36 platform at $SDK_ROOT"

      - name: Configure Android SDK manager
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT/cmdline-tools"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f -print | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version

      - name: Install pinned NDK and CMake required by Android Gradle configuration
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"
          test -d "$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          test -x "$ANDROID_SDK_ROOT/cmake/3.22.1/bin/cmake"

      - name: Run all JVM unit tests
        run: >-
          gradle --no-daemon --continue --build-cache
          :llm-engine:testDebugUnitTest :app:testDebugUnitTest

      - name: Run host-only native correctness utility tests
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror \
            -Illm-engine/src/main/cpp \
            llm-engine/src/test/cpp/prompt_cache_utils_test.cpp \
            -o "$RUNNER_TEMP/prompt-cache-utils-test"
          "$RUNNER_TEMP/prompt-cache-utils-test"
          g++ -std=c++17 -Wall -Wextra -Werror \
            -Illm-engine/src/main/cpp \
            llm-engine/src/test/cpp/utf8_conversion_utils_test.cpp \
            -o "$RUNNER_TEMP/utf8-conversion-utils-test"
          "$RUNNER_TEMP/utf8-conversion-utils-test"
          g++ -std=c++17 -Wall -Wextra -Werror \
            -Illm-engine/src/main/cpp \
            llm-engine/src/test/cpp/gdn_fusion_policy_test.cpp \
            -o "$RUNNER_TEMP/gdn-fusion-policy-test"
          "$RUNNER_TEMP/gdn-fusion-policy-test"
          g++ -std=c++17 -Wall -Wextra -Werror \
            -Illm-engine/src/main/cpp \
            llm-engine/src/test/cpp/q4k_pipeline_fallback_test.cpp \
            -o "$RUNNER_TEMP/q4k-pipeline-fallback-test"
          "$RUNNER_TEMP/q4k-pipeline-fallback-test"
          g++ -std=c++17 -Wall -Wextra -Werror \
            -Illm-engine/src/main/cpp \
            llm-engine/src/test/cpp/qwen35_dense_prompt_fixture_test.cpp \
            -o "$RUNNER_TEMP/qwen35-dense-prompt-fixture-test"
          "$RUNNER_TEMP/qwen35-dense-prompt-fixture-test"
          g++ -std=c++17 -Wall -Wextra -Werror \
            -Illm-engine/src/main/cpp \
            llm-engine/src/test/cpp/gemma4_text_prompt_fixture_test.cpp \
            -o "$RUNNER_TEMP/gemma4-text-prompt-fixture-test"
          "$RUNNER_TEMP/gemma4-text-prompt-fixture-test"
          g++ -std=c++17 -Wall -Wextra -Werror \
            -Illm-engine/src/main/cpp \
            llm-engine/src/test/cpp/gemma4_assistant_architecture_fixture_test.cpp \
            -o "$RUNNER_TEMP/gemma4-assistant-architecture-fixture-test"
          "$RUNNER_TEMP/gemma4-assistant-architecture-fixture-test"
          echo "Host prompt-cache, UTF-16 conversion, GDN and Q4_K Vulkan fallback policies, Qwen3.5 dense, Gemma 4 text and Gemma 4 assistant architecture fixtures passed (also run after JVM test failures)."

      - name: Validate and summarize JUnit reports
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import sys
          import xml.etree.ElementTree as ET

          modules = {
              "llm-engine": "llm-engine/build/test-results/testDebugUnitTest/TEST-*.xml",
              "app": "app/build/test-results/testDebugUnitTest/TEST-*.xml",
          }
          total_tests = total_failures = total_errors = 0
          problems = []

          for module, pattern in modules.items():
              report_files = sorted(glob.glob(pattern))
              if not report_files:
                  problems.append(f"{module}: no JUnit XML reports generated")
                  print(f"ERROR: {module}: no JUnit XML reports generated")
                  continue

              module_tests = module_failures = module_errors = 0
              for report_file in report_files:
                  try:
                      root = ET.parse(report_file).getroot()
                  except (ET.ParseError, OSError) as error:
                      problems.append(f"{report_file}: invalid/unreadable XML: {error}")
                      print(f"ERROR: {report_file}: {error}")
                      continue

                  for case in root.findall(".//testcase"):
                      module_tests += 1
                      name = f"{case.get('classname', 'unknown')}.{case.get('name', 'unknown')}"
                      for failure in case.findall("failure"):
                          module_failures += 1
                          print(f"FAILED: {name}")
                          print(f"Type: {failure.get('type', 'unknown')}")
                          print(f"Message: {failure.get('message', '(no assertion message)')}")
                          detail = (failure.text or "").strip()
                          if detail:
                              print("Failure detail:")
                              print(detail[-12000:])
                      for error in case.findall("error"):
                          module_errors += 1
                          print(f"ERROR: {name}")
                          print(f"Type: {error.get('type', 'unknown')}")
                          print(f"Message: {error.get('message', '(no error message)')}")

              if module_tests == 0:
                  problems.append(f"{module}: reports contain no test cases")
                  print(f"ERROR: {module}: reports contain no test cases")
              print(
                  f"JUnit {module}: tests={module_tests}, "
                  f"failures={module_failures}, errors={module_errors}"
              )
              total_tests += module_tests
              total_failures += module_failures
              total_errors += module_errors

          print(
              f"JUnit TOTAL: tests={total_tests}, failures={total_failures}, "
              f"errors={total_errors}"
          )
          if total_tests == 0:
              problems.append("no test cases found in any module")
          if total_failures or total_errors:
              problems.append("JUnit reported failed or errored test cases")
          if problems:
              print("JUnit report validation FAILED:")
              for problem in problems:
                  print(f" - {problem}")
              sys.exit(1)
          print("JUnit report validation PASSED for both modules.")
          PY

      - name: Upload unit-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports-${{ github.run_number }}
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
            llm-engine/build/test-results/testDebugUnitTest/
            llm-engine/build/reports/tests/testDebugUnitTest/
          if-no-files-found: error
          retention-days: 14
