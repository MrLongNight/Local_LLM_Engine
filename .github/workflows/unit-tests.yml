name: Unit Tests

on:
  push:
    branches:
      - main
    paths:
      - "app/src/**"
      - "app/build.gradle.kts"
      - "llm-engine/src/**"
      - "llm-engine/build.gradle.kts"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradle.properties"
      - "gradle/libs.versions.toml"
      - ".gitmodules"
      - ".github/workflows/unit-tests.yml"
  pull_request:

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests (app + llm-engine)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # The JVM and host-only tests do not compile llama.cpp; skip its large submodule.

      - name: Set up JDK 21 (required by Robolectric SDK 36)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      # JVM tests need the compile SDK, but do not invoke the native Android toolchain.
      # The runner image already carries this platform; avoid downloading NDK/CMake
      # and accepting licenses on every unit-test run.
      - name: Verify preinstalled Android SDK platform
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -f "$SDK_ROOT/platforms/android-36/android.jar"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "Using preinstalled Android 36 platform at $SDK_ROOT"

      - name: Run all JVM unit tests
        run: >-
          gradle --no-daemon --parallel --continue --max-workers=2 --build-cache
          :llm-engine:testDebugUnitTest :app:testDebugUnitTest

      - name: Run host-only native prompt cache and truncation tests
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror \
            -Illm-engine/src/main/cpp \
            llm-engine/src/test/cpp/prompt_cache_utils_test.cpp \
            -o "$RUNNER_TEMP/prompt-cache-utils-test"
          "$RUNNER_TEMP/prompt-cache-utils-test"
          echo "Host prompt-cache and truncation tests passed (also run after JVM test failures)."

      - name: Print failed JUnit assertions
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          report_files = sorted(
              glob.glob("app/build/test-results/testDebugUnitTest/TEST-*.xml")
              + glob.glob("llm-engine/build/test-results/testDebugUnitTest/TEST-*.xml")
          )
          if not report_files:
              print("No JUnit XML reports were generated.")
          for report_file in report_files:
              try:
                  root = ET.parse(report_file).getroot()
              except (ET.ParseError, OSError) as error:
                  print(f"Could not parse {report_file}: {error}")
                  continue
              for case in root.findall(".//testcase"):
                  for failure in list(case.findall("failure")) + list(case.findall("error")):
                      name = f"{case.get('classname', 'unknown')}.{case.get('name', 'unknown')}"
                      print(f"FAILED: {name}")
                      print(f"Type: {failure.get('type', 'unknown')}")
                      print(f"Message: {failure.get('message', '(no assertion message)')}")
                      detail = (failure.text or "").strip()
                      if detail:
                          print("Failure detail:")
                          print(detail[-12000:])
          PY

      - name: Upload unit-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports-${{ github.run_number }}
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
            llm-engine/build/test-results/testDebugUnitTest/
            llm-engine/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14
