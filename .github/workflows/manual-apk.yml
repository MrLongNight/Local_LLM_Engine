name: Android APK Build

on:
  # Native builds are the expensive/critical verification step. Run them only
  # when app, engine, Gradle/toolchain or this workflow changes on main.
  push:
    branches:
      - main
    paths:
      - "app/src/main/**"
      - "app/build.gradle.kts"
      - "llm-engine/src/main/**"
      - "llm-engine/src/androidTest/**"
      - "llm-engine/build.gradle.kts"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - ".github/workflows/manual-apk.yml"
      - ".gitmodules"
  workflow_dispatch:
    inputs:
      build_type:
        description: "APK build type"
        required: true
        type: choice
        options:
          - debug
        default: debug

permissions:
  contents: read

concurrency:
  group: manual-apk-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build installable Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify pinned llama.cpp submodule
        shell: bash
        run: |
          set -euo pipefail
          LLAMA_DIR="llm-engine/src/main/cpp/llama.cpp"
          EXPECTED="e14a779719652200cec7ad58dfa4820edc347182"
          actual="$(git -C "$LLAMA_DIR" rev-parse HEAD)"
          test "$actual" = "$EXPECTED"
          echo "Verified ggml-org/llama.cpp at $actual"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      # GitHub-hosted Ubuntu runners already provide the Android SDK.
      # Avoid setup-android: it tries to install the removed legacy "tools" package.
      - name: Configure preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT/cmdline-tools"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f -print | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "Using Android SDK at $SDK_ROOT"
          "$SDKMANAGER" --version

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail
          # sdkmanager closes stdin after accepting the final license. That makes
          # yes exit with SIGPIPE; keep pipefail off so sdkmanager's status wins.
          set +o pipefail
          yes | sdkmanager --licenses

      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Install Vulkan shader compiler and SPIR-V headers
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y glslc git

          # Pin headers to the Vulkan generation used by this native build.
          SPIRV_HEADERS_DIR="$RUNNER_TEMP/SPIRV-Headers"
          git clone --depth 1 --branch vulkan-sdk-1.3.275.0 https://github.com/KhronosGroup/SPIRV-Headers.git "$SPIRV_HEADERS_DIR"
          SPIRV_HEADERS_INCLUDE_DIR="$SPIRV_HEADERS_DIR/include"
          test -f "$SPIRV_HEADERS_INCLUDE_DIR/spirv/unified1/spirv.hpp"

          VULKAN_HEADERS_DIR="$RUNNER_TEMP/Vulkan-Headers"
          git clone --depth 1 --branch v1.3.275 https://github.com/KhronosGroup/Vulkan-Headers.git "$VULKAN_HEADERS_DIR"
          VULKAN_HEADERS_INCLUDE_DIR="$VULKAN_HEADERS_DIR/include"
          test -f "$VULKAN_HEADERS_INCLUDE_DIR/vulkan/vulkan.hpp"

          echo "SPIRV_HEADERS_INCLUDE_DIR=$SPIRV_HEADERS_INCLUDE_DIR" >> "$GITHUB_ENV"
          echo "VULKAN_HEADERS_INCLUDE_DIR=$VULKAN_HEADERS_INCLUDE_DIR" >> "$GITHUB_ENV"
          echo "LOCAL_LLM_REQUIRE_VULKAN=1" >> "$GITHUB_ENV"

      - name: Create temporary debug signing key
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build APK and process-isolation test APK
        run: gradle --no-daemon :app:assembleDebug :llm-engine:assembleDebugAndroidTest

      - name: Verify instrumentation test APK exists
        shell: bash
        run: |
          set -euo pipefail
          test_apk="$(find llm-engine/build/outputs/apk/androidTest/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$test_apk"
          ls -lh "$test_apk"

      - name: Verify native Debug optimization flags
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import json
          import os
          import re
          import shlex

          databases = glob.glob("llm-engine/.cxx/**/compile_commands.json", recursive=True)
          if not databases:
              raise SystemExit("No compile_commands.json found; cannot verify native optimization flags")

          for abi in ("arm64-v8a", "x86_64"):
              db = next((p for p in databases if f"/{abi}/" in p.replace("\\\\", "/")), None)
              if db is None:
                  raise SystemExit(f"No compile database found for ABI {abi}")

              with open(db, encoding="utf-8") as stream:
                  entries = json.load(stream)

              selected = [
                  e for e in entries
                  if os.path.basename(e.get("file", "")) == "local_llm_engine_jni.cpp"
              ]
              if not selected:
                  raise SystemExit(f"No JNI compile entry found for ABI {abi}")

              if abi == "arm64-v8a":
                  vulkan_sources = [
                      e for e in entries
                      if os.path.basename(e.get("file", "")) == "ggml-vulkan.cpp"
                  ]
                  if not vulkan_sources:
                      raise SystemExit(
                          "arm64-v8a: ggml-vulkan.cpp is missing from compile_commands.json; "
                          "the APK would not contain the Vulkan backend"
                      )

                  # CMake intentionally leaves the pinned upstream submodule pristine
                  # and compiles a generated, patched build-directory copy. Verify the
                  # source path recorded by the actual compiler invocation, not upstream.
                  required_vulkan_fixes = {
                      "pre-1.2 buffer device address extension":
                          'device_extensions.push_back("VK_KHR_buffer_device_address")',
                      "pre-1.2 timeline semaphore extension":
                          'device_extensions.push_back("VK_KHR_timeline_semaphore")',
                      "Vulkan 1.1 core 16-bit storage guard":
                          "device->properties.apiVersion < VK_API_VERSION_1_1",
                      "device-level Vulkan-Hpp dispatcher initialization":
                          "VULKAN_HPP_DEFAULT_DISPATCHER.init(device->device)",
                      "Android Vulkan compatibility overlay marker":
                          "LOCAL_LLM_ANDROID_VULKAN_COMPAT",
                  }
                  for vulkan_entry in vulkan_sources:
                      vulkan_file = vulkan_entry.get("file", "")
                      if not os.path.isabs(vulkan_file):
                          vulkan_file = os.path.join(
                              vulkan_entry.get("directory", "."), vulkan_file
                          )
                      with open(vulkan_file, encoding="utf-8") as stream:
                          compiled_vulkan_source = stream.read()
                      for description, marker in required_vulkan_fixes.items():
                          if marker not in compiled_vulkan_source:
                              raise SystemExit(
                                  f"arm64-v8a compiled Vulkan source {vulkan_file} "
                                  f"is missing compatibility fix: {description}"
                              )
                      print(
                          "arm64-v8a: verified generated Vulkan compatibility source "
                          f"was compiled: {vulkan_file}"
                      )

              for entry in selected:
                  command = entry.get("command")
                  args = shlex.split(command) if command else entry.get("arguments", [])
                  optimizations = [arg for arg in args if re.fullmatch(r"-O(?:[0-3]|s|z|fast)", arg)]
                  final_optimization = optimizations[-1] if optimizations else None
                  print(f"{abi}: native JNI compile optimization flags={optimizations}")
                  if final_optimization != "-O2":
                      raise SystemExit(f"{abi}: expected final -O2 but found {final_optimization}")

          print("Verified native JNI compilation with -O2 for arm64-v8a and x86_64.")
          PY

      - name: Verify APK exists
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Verify merged APK service manifest
        shell: bash
        run: |
          set -euo pipefail
          APK_ANALYZER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer -print -quit)"
          test -n "$APK_ANALYZER"
          "$APK_ANALYZER" manifest print app/build/outputs/apk/debug/app-debug.apk > "$RUNNER_TEMP/merged-manifest.xml"
          python3 - "$RUNNER_TEMP/merged-manifest.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          android = "{http://schemas.android.com/apk/res/android}"
          root = ET.parse(sys.argv[1]).getroot()
          app = root.find("application")
          if app is None:
              raise SystemExit("APK manifest has no application element")

          service_name = "com.mydocanizer.llm.engine.ipc.InferenceService"
          services = [
              item for item in app.findall("service")
              if item.get(android + "name") == service_name
          ]
          if len(services) != 1:
              raise SystemExit(
                  f"Expected exactly one merged InferenceService declaration; found {len(services)}"
              )

          service = services[0]
          process = service.get(android + "process", "")
          if not process.endswith(":inference"):
              raise SystemExit(f"InferenceService is not in :inference process: {process!r}")
          if service.get(android + "exported", "").lower() != "false":
              raise SystemExit("InferenceService must have android:exported=false")
          if service.get(android + "isolatedProcess", "false").lower() != "false":
              raise SystemExit("InferenceService must have android:isolatedProcess=false")

          permissions = {
              item.get(android + "name")
              for item in root.findall("uses-permission")
          }
          required = {
              "android.permission.INTERNET",
              "android.permission.ACCESS_NETWORK_STATE",
          }
          missing = required - permissions
          if missing:
              raise SystemExit(f"Missing library network permissions in merged APK: {sorted(missing)}")

          print(
              "Verified merged APK manifest: one private InferenceService, "
              f"process={process}, exported=false, isolatedProcess=false"
          )
          print("Verified INTERNET and ACCESS_NETWORK_STATE permissions.")
          PY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Local-LMM-Engine-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run process-isolation instrumentation tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: gradle --no-daemon :llm-engine:connectedDebugAndroidTest

