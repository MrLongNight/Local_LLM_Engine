name: Android APK Build

on:
  # Native builds are the expensive/critical verification step. Run them only
  # when app, engine, Gradle/toolchain or this workflow changes on main.
  push:
    branches:
      - main
    paths:
      - "app/src/main/**"
      - "app/src/debug/**"
      - "app/build.gradle.kts"
      - "llm-engine/src/main/**"
      - "llm-engine/src/androidTest/**"
      - "llm-engine/build.gradle.kts"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - ".github/workflows/manual-apk.yml"
      - ".gitmodules"
  workflow_dispatch:
    inputs:
      build_type:
        description: "APK build type"
        required: true
        type: choice
        options:
          - debug
        default: debug
      enable_vulkan_perf_profiler:
        description: "Separate diagnostic APK with Vulkan operator timestamps (not for throughput benchmarks)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: manual-apk-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build installable Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify pinned llama.cpp submodule
        shell: bash
        run: |
          set -euo pipefail
          LLAMA_DIR="llm-engine/src/main/cpp/llama.cpp"
          EXPECTED="a4d4f2fd4ec85ec6a0a9ece4870416c1b6cc24f5"
          actual="$(git -C "$LLAMA_DIR" rev-parse HEAD)"
          test "$actual" = "$EXPECTED"
          echo "Verified ggml-org/llama.cpp at $actual"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      # GitHub-hosted Ubuntu runners already provide the Android SDK.
      # Avoid setup-android: it tries to install the removed legacy "tools" package.
      - name: Configure preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT/cmdline-tools"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f -print | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "Using Android SDK at $SDK_ROOT"
          "$SDKMANAGER" --version

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail
          # sdkmanager closes stdin after accepting the final license. That makes
          # yes exit with SIGPIPE; keep pipefail off so sdkmanager's status wins.
          set +o pipefail
          yes | sdkmanager --licenses

      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Cache pinned Vulkan SDK
        id: vulkan-sdk-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vulkan-sdk
          key: vulkan-sdk-linux-x86_64-1.4.363.0-197962f5cbf80baf2775a03336a01cee7c8745686c65aaa70d3f751ade4d7e43

      - name: Install pinned Vulkan SDK and verify integer-dot shader support
        shell: bash
        run: |
          set -euo pipefail
          SDK_VERSION="1.4.363.0"
          SDK_ARCHIVE="vulkansdk-linux-x86_64-${SDK_VERSION}.tar.xz"
          SDK_SHA256="197962f5cbf80baf2775a03336a01cee7c8745686c65aaa70d3f751ade4d7e43"
          SDK_DOWNLOAD="$RUNNER_TEMP/$SDK_ARCHIVE"
          SDK_EXTRACT="$RUNNER_TEMP/vulkan-sdk"

          if [[ ! -x "$SDK_EXTRACT/$SDK_VERSION/x86_64/bin/glslc" ]]; then
            command -v curl >/dev/null
            if ! command -v xz >/dev/null; then
              sudo apt-get update
              sudo apt-get install -y xz-utils
            fi
            curl --fail --location --retry 3 --retry-all-errors --connect-timeout 20 --max-time 600 \
              "https://sdk.lunarg.com/sdk/download/${SDK_VERSION}/linux/vulkan_sdk.tar.xz" \
              --output "$SDK_DOWNLOAD"
            printf '%s  %s' "$SDK_SHA256" "$SDK_DOWNLOAD" | sha256sum --check --strict

            mkdir -p "$SDK_EXTRACT"
            tar -xJf "$SDK_DOWNLOAD" -C "$SDK_EXTRACT"
          else
            echo "Using cached Vulkan SDK $SDK_VERSION."
          fi
          VULKAN_SDK="$SDK_EXTRACT/$SDK_VERSION/x86_64"
          test -x "$VULKAN_SDK/bin/glslc"
          test -f "$VULKAN_SDK/include/spirv/unified1/spirv.hpp"
          test -f "$VULKAN_SDK/include/vulkan/vulkan.hpp"

          export LD_LIBRARY_PATH="$VULKAN_SDK/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          "$VULKAN_SDK/bin/glslc" --version

          FEATURE_SHADER="llm-engine/src/main/cpp/llama.cpp/ggml/src/ggml-vulkan/vulkan-shaders/feature-tests/integer_dot.comp"
          test -f "$FEATURE_SHADER"
          "$VULKAN_SDK/bin/glslc" -o /dev/null -fshader-stage=compute --target-env=vulkan1.3 "$FEATURE_SHADER"
          echo "Verified GL_EXT_integer_dot_product compilation with Vulkan SDK $SDK_VERSION"

          echo "VULKAN_SDK=$VULKAN_SDK" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
          echo "$VULKAN_SDK/bin" >> "$GITHUB_PATH"
          echo "SPIRV_HEADERS_INCLUDE_DIR=$VULKAN_SDK/include" >> "$GITHUB_ENV"
          echo "VULKAN_HEADERS_INCLUDE_DIR=$VULKAN_SDK/include" >> "$GITHUB_ENV"
          echo "LOCAL_LLM_REQUIRE_VULKAN=1" >> "$GITHUB_ENV"

      - name: Prepare persistent debug signing key
        shell: bash
        env:
          LOCAL_LLM_DEBUG_KEYSTORE_BASE64: ${{ secrets.LOCAL_LLM_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -n "${LOCAL_LLM_DEBUG_KEYSTORE_BASE64:-}" ]]; then
            printf '%s' "$LOCAL_LLM_DEBUG_KEYSTORE_BASE64" | base64 --decode > debug.keystore
            keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey >/dev/null
            echo "Using the persistent CI debug signing key from repository Actions secrets."
          else
            echo "::warning::LOCAL_LLM_DEBUG_KEYSTORE_BASE64 is not configured. This APK gets a one-run key and cannot update APKs signed by previous CI runs."
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          test -s debug.keystore

      - name: Download pinned tiny GGUF integration fixture
        shell: bash
        run: |
          set -euo pipefail
          MODEL_DIR="llm-engine/src/androidTest/assets"
          MODEL_PATH="$MODEL_DIR/tiny1m.Q4_K_M.gguf"
          MODEL_URL="https://huggingface.co/shibatch/tiny1m/resolve/807ecced53a5bf80b5cdd5afcdbfc2f47c3935b1/tiny1m.Q4_K_M.gguf"
          EXPECTED_SHA256="ae0bb9b0ca9bb62ccbef04fc1dc1217bbe9b7a2f82c9cbc475c30ee65a4030fb"
          mkdir -p "$MODEL_DIR"
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 20 --max-time 120 "$MODEL_URL" --output "$MODEL_PATH"
          printf '%s  %s\n' "$EXPECTED_SHA256" "$MODEL_PATH" | sha256sum --check --strict
          ls -lh "$MODEL_PATH"

      - name: Build APK and process-isolation test APK
        shell: bash
        env:
          ENABLE_VULKAN_PERF_PROFILER: ${{ github.event_name == 'workflow_dispatch' && inputs.enable_vulkan_perf_profiler || 'false' }}
        run: |
          set -euo pipefail
          gradle_args=()
          if [[ "${ENABLE_VULKAN_PERF_PROFILER}" == "true" ]]; then
            echo "Building separate Vulkan per-operation profiler APK."
            gradle_args+=("-PlocalLlmVulkanPerfProfiler=true")
          else
            echo "Building profiler-disabled APK for normal use and throughput comparisons."
          fi
          gradle --no-daemon "${gradle_args[@]}" :app:assembleDebug :llm-engine:assembleDebugAndroidTest

      - name: Verify explicit profiler BuildConfig selection
        shell: bash
        env:
          ENABLE_VULKAN_PERF_PROFILER: ${{ github.event_name == 'workflow_dispatch' && inputs.enable_vulkan_perf_profiler || 'false' }}
        run: |
          set -euo pipefail
          expected=false
          if [[ "${ENABLE_VULKAN_PERF_PROFILER}" == "true" ]]; then
            expected=true
          fi
          build_config="$(find llm-engine/build/generated -type f -name BuildConfig.java -print -quit)"
          test -n "$build_config"
          grep -Eq "VULKAN_PERF_PROFILER_ENABLED[[:space:]]*=[[:space:]]*${expected};" "$build_config"
          echo "Verified VULKAN_PERF_PROFILER_ENABLED=${expected} in ${build_config}"

      - name: Verify instrumentation test APK exists
        shell: bash
        run: |
          set -euo pipefail
          test_apk="$(find llm-engine/build/outputs/apk/androidTest/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$test_apk"
          ls -lh "$test_apk"

      - name: Verify native Debug optimization flags
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import json
          import os
          import re
          import shlex

          databases = glob.glob("llm-engine/.cxx/**/compile_commands.json", recursive=True)
          if not databases:
              raise SystemExit("No compile_commands.json found; cannot verify native optimization flags")

          for abi in ("arm64-v8a", "x86_64"):
              db = next((p for p in databases if f"/{abi}/" in p.replace("\\\\", "/")), None)
              if db is None:
                  raise SystemExit(f"No compile database found for ABI {abi}")

              with open(db, encoding="utf-8") as stream:
                  entries = json.load(stream)

              selected = [
                  e for e in entries
                  if os.path.basename(e.get("file", "")) == "local_llm_engine_jni.cpp"
              ]
              if not selected:
                  raise SystemExit(f"No JNI compile entry found for ABI {abi}")

              if abi == "arm64-v8a":
                  vulkan_sources = [
                      e for e in entries
                      if os.path.basename(e.get("file", "")) == "ggml-vulkan.cpp"
                  ]
                  if not vulkan_sources:
                      raise SystemExit(
                          "arm64-v8a: ggml-vulkan.cpp is missing from compile_commands.json; "
                          "the APK would not contain the Vulkan backend"
                      )

                  # CMake intentionally leaves the pinned upstream submodule pristine
                  # and compiles a generated, patched build-directory copy. Verify the
                  # source path recorded by the actual compiler invocation, not upstream.
                  required_vulkan_fixes = {
                      "pre-1.2 buffer device address extension":
                          'device_extensions.push_back("VK_KHR_buffer_device_address")',
                      "pre-1.2 timeline semaphore extension":
                          'device_extensions.push_back("VK_KHR_timeline_semaphore")',
                      "Vulkan 1.1 core 16-bit storage guard":
                          "device->properties.apiVersion < VK_API_VERSION_1_1",
                      "device-level Vulkan-Hpp dispatcher initialization":
                          "VULKAN_HPP_DEFAULT_DISPATCHER.init(device->device)",
                      "Android Vulkan compatibility overlay marker":
                          "LOCAL_LLM_ANDROID_VULKAN_COMPAT",
                      "Q4_K prefill runtime path instrumentation":
                          "LOCAL_LLM_VULKAN_Q4_K_PREFILL_PATH",
                      "Q4_K decode runtime path instrumentation":
                          "LOCAL_LLM_VULKAN_Q4_K_DECODE_PATH",
                      "Vulkan integrated-memory budget diagnostics":
                          "LOCAL_LLM_MEMORY_BUDGET",
                      "Vulkan per-operation GPU timestamp diagnostics":
                          "LOCAL_LLM_VULKAN_OP_TIMING",
                      "Vulkan profiler inference-run correlation":
                          "local_llm_vulkan_profile_run_id()",
                      "Vulkan profiler operation-name field sanitization":
                          "std::replace(operation_name.begin(), operation_name.end(), ',', ';')",
                      "Vulkan DMMV workgroup selector bridge":
                          "local_llm_vulkan_dmmv_workgroup_override()",
                      "Vulkan DMMV workgroup selection diagnostics":
                          "LOCAL_LLM_VULKAN_DMMV_WG_SELECTED",
                      "Q4_K base DMMV path override":
                          "LOCAL_LLM_Q4K_BASE_DMMV_OVERRIDE",
                      "Mali AUTO Q4_K decode policy":
                          "LOCAL_LLM_MALI_Q4K_AUTO_BASE_DMMV",
                      "Q4_K prefill F16/F32 override":
                          "LOCAL_LLM_Q4K_PREFILL_F16_OVERRIDE",
                      "Qwen3.5 GDN CPU fallback":
                          "LOCAL_LLM_QWEN35_GDN_CPU_FALLBACK",
                      "Forced MMVQ selection":
                          "LOCAL_LLM_VULKAN_MMVQ_FORCE",,
                      "Mali blocking Vulkan fence wait":
                          "LOCAL_LLM_MALI_BLOCKING_FENCE_WAIT"
                  }
                  for vulkan_entry in vulkan_sources:
                      vulkan_file = vulkan_entry.get("file", "")
                      if not os.path.isabs(vulkan_file):
                          vulkan_file = os.path.join(
                              vulkan_entry.get("directory", "."), vulkan_file
                          )
                      with open(vulkan_file, encoding="utf-8") as stream:
                          compiled_vulkan_source = stream.read()
                      for description, marker in required_vulkan_fixes.items():
                          if marker not in compiled_vulkan_source:
                              raise SystemExit(
                                  f"arm64-v8a compiled Vulkan source {vulkan_file} "
                                  f"is missing compatibility fix: {description}"
                              )

                      command = vulkan_entry.get("command")
                      vulkan_args = shlex.split(command) if command else vulkan_entry.get("arguments", [])
                      integer_dot_define = "-DGGML_VULKAN_INTEGER_DOT_GLSLC_SUPPORT"
                      if not any(
                          arg == integer_dot_define or arg.startswith(integer_dot_define + "=")
                          for arg in vulkan_args
                      ):
                          raise SystemExit(
                              "arm64-v8a ggml-vulkan.cpp compile command is missing "
                              "GGML_VULKAN_INTEGER_DOT_GLSLC_SUPPORT; the fast Q4_K "
                              "integer-dot kernels would not be compiled"
                          )
                      print(
                          "arm64-v8a: verified upstream GGML_VULKAN_INTEGER_DOT_GLSLC_SUPPORT "
                          "is active for the compiled Vulkan source."
                      )
                      print(
                          "arm64-v8a: verified generated Vulkan compatibility/performance "
                          f"diagnostics source was compiled: {vulkan_file}"
                      )

              if abi == "arm64-v8a":
                  # CMake may compile the generated source as an independent TU or
                  # include it in a generated UNITY_BUILD TU (depending on generator/
                  # CMake version). Verify the actual compile database either way.
                  graph_context_sources = []
                  compiled_graph_overlays = []
                  for entry in entries:
                      source_file = entry.get("file", "")
                      if not os.path.isabs(source_file):
                          source_file = os.path.join(entry.get("directory", "."), source_file)
                      if not os.path.isfile(source_file):
                          continue
                      with open(source_file, encoding="utf-8") as stream:
                          compiled_source = stream.read()
                      if (
                          os.path.basename(source_file) == "llama-context.cpp"
                          and "LOCAL_LLM_GRAPH_BACKEND_DISTRIBUTION" in compiled_source
                          and "ggml_backend_sched_get_tensor_backend" in compiled_source
                          and "LOCAL_LLM_QWEN35_GDN_POLICY" in compiled_source
                          and "local_llm_gdn_policy_for_arch" in compiled_source
                          and "local_llm_gdn_fused_flags" in compiled_source
                          and "vulkanGdn=cpu-fallback" in compiled_source
                      ):
                          graph_context_sources.append(source_file)
                          compiled_graph_overlays.append(source_file)
                          continue
                      # In Unity mode the compiled TU contains an include of the
                      # generated overlay rather than its source text. Record that
                      # exact include and verify the referenced generated file below.
                      if "local-android-llama/llama-context.cpp" in compiled_source:
                          graph_context_sources.append(source_file)
                          for candidate in glob.glob(
                              "llm-engine/.cxx/**/local-android-llama/llama-context.cpp",
                              recursive=True,
                          ):
                              with open(candidate, encoding="utf-8") as overlay_stream:
                                  overlay_source = overlay_stream.read()
                              if (
                                  "LOCAL_LLM_GRAPH_BACKEND_DISTRIBUTION" in overlay_source
                                  and "ggml_backend_sched_get_tensor_backend" in overlay_source
                                  and "LOCAL_LLM_QWEN35_GDN_POLICY" in overlay_source
                                  and "local_llm_gdn_policy_for_arch" in overlay_source
                                  and "local_llm_gdn_fused_flags" in overlay_source
                                  and "vulkanGdn=cpu-fallback" in overlay_source
                              ):
                                  compiled_graph_overlays.append(candidate)
                  if not graph_context_sources or not compiled_graph_overlays:
                      raise SystemExit(
                          "arm64-v8a: generated llama-context.cpp graph diagnostics overlay "
                          "is not present in any compiled translation unit from compile_commands.json"
                      )
                  print(
                      "arm64-v8a: verified per-run CPU/Vulkan graph-node assignment diagnostics "
                      "are compiled (direct source or generated Unity translation unit)."
                  )

                  kleidiai_sources = [
                      e for e in entries
                      if os.path.basename(e.get("file", "")) == "kleidiai.cpp"
                  ]
                  if not kleidiai_sources:
                      raise SystemExit(
                          "arm64-v8a: KleidiAI runtime-dispatch source is missing from compile_commands.json"
                      )
                  for entry in kleidiai_sources:
                      command = entry.get("command")
                      args = shlex.split(command) if command else entry.get("arguments", [])
                      if not any(
                          arg == "-DGGML_USE_CPU_KLEIDIAI" or arg.startswith("-DGGML_USE_CPU_KLEIDIAI=")
                          for arg in args
                      ):
                          raise SystemExit(
                              "arm64-v8a: kleidiai.cpp is compiled without GGML_USE_CPU_KLEIDIAI"
                          )
                  print(
                      "arm64-v8a: verified KleidiAI DOTPROD/I8MM runtime-dispatch source "
                      "and compile definition."
                  )

                  has_integer_dot_runtime_marker = False
                  for entry in selected:
                      command = entry.get("command")
                      args = shlex.split(command) if command else entry.get("arguments", [])
                      if any(
                          arg == "-DLOCAL_LLM_INTEGER_DOT_GLSLC_SUPPORTED=1"
                          for arg in args
                      ):
                          has_integer_dot_runtime_marker = True
                          break
                  if not has_integer_dot_runtime_marker:
                      raise SystemExit(
                          "arm64-v8a JNI compile command is missing "
                          "LOCAL_LLM_INTEGER_DOT_GLSLC_SUPPORTED=1; "
                          "the app-side build-capability diagnostic would be false"
                      )

              for entry in selected:
                  command = entry.get("command")
                  args = shlex.split(command) if command else entry.get("arguments", [])
                  optimizations = [arg for arg in args if re.fullmatch(r"-O(?:[0-3]|s|z|fast)", arg)]
                  final_optimization = optimizations[-1] if optimizations else None
                  print(f"{abi}: native JNI compile optimization flags={optimizations}")
                  if final_optimization != "-O2":
                      raise SystemExit(f"{abi}: expected final -O2 but found {final_optimization}")

          print("Verified native JNI compilation with -O2 for arm64-v8a and x86_64.")
          PY

      - name: Verify APK exists
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Verify merged APK service manifest
        shell: bash
        run: |
          set -euo pipefail
          APK_ANALYZER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer -print -quit)"
          test -n "$APK_ANALYZER"
          "$APK_ANALYZER" manifest print app/build/outputs/apk/debug/app-debug.apk > "$RUNNER_TEMP/merged-manifest.xml"
          python3 - "$RUNNER_TEMP/merged-manifest.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          android = "{http://schemas.android.com/apk/res/android}"
          root = ET.parse(sys.argv[1]).getroot()
          app = root.find("application")
          if app is None:
              raise SystemExit("APK manifest has no application element")

          service_name = "com.mydocanizer.llm.engine.ipc.InferenceService"
          services = [
              item for item in app.findall("service")
              if item.get(android + "name") == service_name
          ]
          if len(services) != 1:
              raise SystemExit(
                  f"Expected exactly one merged InferenceService declaration; found {len(services)}"
              )

          service = services[0]
          process = service.get(android + "process", "")
          if not process.endswith(":inference"):
              raise SystemExit(f"InferenceService is not in :inference process: {process!r}")
          if service.get(android + "exported", "").lower() != "false":
              raise SystemExit("InferenceService must have android:exported=false")
          if service.get(android + "isolatedProcess", "false").lower() != "false":
              raise SystemExit("InferenceService must have android:isolatedProcess=false")

          permissions = {
              item.get(android + "name")
              for item in root.findall("uses-permission")
          }
          required = {
              "android.permission.INTERNET",
              "android.permission.ACCESS_NETWORK_STATE",
          }
          missing = required - permissions
          if missing:
              raise SystemExit(f"Missing library network permissions in merged APK: {sorted(missing)}")

          print(
              "Verified merged APK manifest: one private InferenceService, "
              f"process={process}, exported=false, isolatedProcess=false"
          )
          print("Verified INTERNET and ACCESS_NETWORK_STATE permissions.")
          PY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Local-LMM-Engine-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload instrumentation test APK
        uses: actions/upload-artifact@v4
        with:
          name: Local-LMM-Engine-instrumentation-test-apk
          path: llm-engine/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run process-isolation instrumentation tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: gradle --no-daemon :llm-engine:connectedDebugAndroidTest

