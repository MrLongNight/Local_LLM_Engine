name: Android APK Build

on:
  # Native builds are the expensive/critical verification step. Run them only
  # when app, engine, Gradle/toolchain or this workflow changes on main.
  push:
    branches:
      - main
    paths:
      - "app/src/main/**"
      - "app/build.gradle.kts"
      - "llm-engine/src/main/**"
      - "llm-engine/build.gradle.kts"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - ".github/workflows/manual-apk.yml"
  workflow_dispatch:
    inputs:
      build_type:
        description: "APK build type"
        required: true
        type: choice
        options:
          - debug
        default: debug

permissions:
  contents: read

concurrency:
  group: manual-apk-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build installable Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        shell: bash
        run: yes | sdkmanager --licenses

      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Install Vulkan shader compiler and SPIR-V headers
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y glslc git

          # Pin headers to the Vulkan generation used by this native build.
          SPIRV_HEADERS_DIR="$RUNNER_TEMP/SPIRV-Headers"
          git clone --depth 1 --branch vulkan-sdk-1.3.275.0 https://github.com/KhronosGroup/SPIRV-Headers.git "$SPIRV_HEADERS_DIR"
          SPIRV_HEADERS_INCLUDE_DIR="$SPIRV_HEADERS_DIR/include"
          test -f "$SPIRV_HEADERS_INCLUDE_DIR/spirv/unified1/spirv.hpp"

          VULKAN_HEADERS_DIR="$RUNNER_TEMP/Vulkan-Headers"
          git clone --depth 1 --branch v1.3.275 https://github.com/KhronosGroup/Vulkan-Headers.git "$VULKAN_HEADERS_DIR"
          VULKAN_HEADERS_INCLUDE_DIR="$VULKAN_HEADERS_DIR/include"
          test -f "$VULKAN_HEADERS_INCLUDE_DIR/vulkan/vulkan.hpp"

          echo "SPIRV_HEADERS_INCLUDE_DIR=$SPIRV_HEADERS_INCLUDE_DIR" >> "$GITHUB_ENV"
          echo "VULKAN_HEADERS_INCLUDE_DIR=$VULKAN_HEADERS_INCLUDE_DIR" >> "$GITHUB_ENV"
          echo "LOCAL_LLM_REQUIRE_VULKAN=1" >> "$GITHUB_ENV"

      - name: Create temporary debug signing key
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK exists
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Local-LMM-Engine-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
