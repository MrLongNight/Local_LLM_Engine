name: Manual Android APK Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "APK build type"
        required: true
        type: choice
        options:
          - debug
        default: debug

permissions:
  contents: read

concurrency:
  group: manual-apk-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build installable Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Locate Android SDK command-line tools
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT/cmdline-tools" ]; then
            echo "::error::Android SDK command-line tools directory not found (ANDROID_HOME=$SDK_ROOT)"
            exit 1
          fi
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -perm -u+x -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager executable not found under $SDK_ROOT/cmdline-tools"
            find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -type f -print || true
            exit 1
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "Using Android SDK manager: $SDKMANAGER"

      - name: Install Android NDK and CMake
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "ndk;27.2.12479018" "cmake;3.22.1"
          yes | sdkmanager --licenses

      - name: Install Vulkan shader compiler and SPIR-V headers
        run: |
          sudo apt-get update
          sudo apt-get install -y glslc spirv-headers
          SPIRV_HEADERS_CMAKE_DIR="$(find /usr/share/cmake -name SPIRV-HeadersConfig.cmake -print -quit | xargs -r dirname)"
          if [ -z "$SPIRV_HEADERS_CMAKE_DIR" ]; then
            echo "::error::SPIRV-Headers CMake package config was not installed"
            dpkg -L spirv-headers || true
            exit 1
          fi
          echo "SPIRV_HEADERS_CMAKE_DIR=$SPIRV_HEADERS_CMAKE_DIR" >> "$GITHUB_ENV"
          echo "Using SPIRV-Headers CMake package: $SPIRV_HEADERS_CMAKE_DIR"
          command -v glslc

      - name: Create temporary debug signing key
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK exists
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Local-LMM-Engine-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
