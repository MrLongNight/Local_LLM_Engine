name: Unzip Files
on:
  push:
    branches: [main]
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Extract ZIP
        run: |
          unzip app.zip -d .
          rm app.zip
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add .
          git commit -m "Auto-extracted ZIP files"
          git push
